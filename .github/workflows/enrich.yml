name: Enriquecimento de Imóveis — Detalhes Caixa

on:
  # Roda 1h após cada execução do scraper diário
  schedule:
    - cron: "0 7 * * *"    # 04:00 BRT
    - cron: "0 14 * * *"   # 11:00 BRT
    - cron: "0 22 * * *"   # 19:00 BRT
  workflow_dispatch:        # permite rodar manualmente com parâmetros
    inputs:
      limite:
        description: "Número máximo de imóveis a processar"
        required: false
        default: "300"
      estado:
        description: "Filtrar por estado (ex: SP). Deixe vazio para todos."
        required: false
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Enriquecer imóveis (schedule automático)
        if: github.event_name == 'schedule'
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: |
          cd scraper
          python enrich.py --limite 300 --headless

      - name: Enriquecer imóveis (disparo manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: |
          cd scraper
          ESTADO="${{ github.event.inputs.estado }}"
          LIMITE="${{ github.event.inputs.limite }}"
          ARGS="--limite $LIMITE --headless"
          if [ -n "$ESTADO" ]; then
            ARGS="$ARGS --estado $ESTADO"
          fi
          python enrich.py $ARGS
