name: Geração de Descrições — Claude Haiku

on:
  workflow_dispatch:
    inputs:
      estado:
        description: "Filtrar por estado (ex: SP). Deixe vazio para todos."
        default: ""
      limite:
        description: "Máximo de imóveis a processar (0 = todos)"
        default: "500"
      reprocessar:
        description: "Reprocessar imóveis que já têm descrição?"
        type: boolean
        default: false

jobs:
  gera:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Gerar descrições
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd scraper
          ARGS=""
          if [ -n "${{ github.event.inputs.estado }}" ]; then
            ARGS="$ARGS --estado ${{ github.event.inputs.estado }}"
          fi
          if [ "${{ github.event.inputs.limite }}" != "0" ]; then
            ARGS="$ARGS --limite ${{ github.event.inputs.limite }}"
          fi
          if [ "${{ github.event.inputs.reprocessar }}" = "true" ]; then
            ARGS="$ARGS --reprocessar"
          fi
          python gera_descricao.py $ARGS
