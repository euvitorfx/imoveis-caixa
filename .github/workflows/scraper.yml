name: Scraper Diário — Caixa Imóveis

on:
  schedule:
    - cron: "0 6 * * *"    # 03:00 BRT
    - cron: "0 13 * * *"   # 10:00 BRT
    - cron: "0 21 * * *"   # 18:00 BRT
  workflow_dispatch:       # permite rodar manualmente

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper (Brasil todo)
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: |
          cd scraper
          python run.py --headless --sem-detalhes

      - name: Migrar fotos novas para R2
        env:
          MONGODB_URI:          ${{ secrets.MONGODB_URI }}
          MONGODB_DB:           ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION:   ${{ secrets.MONGODB_COLLECTION }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          cd scraper
          python migrar_fotos.py --limite 500 --recentes
