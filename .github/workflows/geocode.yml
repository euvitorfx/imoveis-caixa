name: Geocodificação — Imóveis sem coordenadas

on:
  schedule:
    - cron: "0 4 * * *"   # 01:00 BRT — após o scraper das 03h
  workflow_dispatch:
    inputs:
      lote:
        description: "Imóveis por lote (padrão 2000)"
        default: "2000"
      retry_falhas:
        description: "Reprocessar lat=null além de sem-lat?"
        type: boolean
        default: false

jobs:
  geocode:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6h — Nominatim exige 1s/req; 2000 lotes ≈ ~37min cada

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Geocodificar imóveis pendentes
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
        run: |
          cd scraper
          ARGS="--lote ${{ github.event.inputs.lote || '2000' }}"
          if [ "${{ github.event.inputs.retry_falhas }}" = "true" ]; then
            ARGS="$ARGS --retry-falhas"
          fi
          python geocode_run.py $ARGS
