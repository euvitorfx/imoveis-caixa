name: Migração de Fotos → Cloudinary

on:
  workflow_dispatch:
    inputs:
      estado:
        description: "Filtrar por estado (ex: SP). Deixe vazio para todos."
        default: ""
      limite:
        description: "Máximo de imóveis a processar (0 = todos)"
        default: "0"

jobs:
  migrar:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6h — ~24k fotos a 0.5s/req ≈ 3.5h

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run migration
        working-directory: scraper
        env:
          MONGODB_URI:            ${{ secrets.MONGODB_URI }}
          MONGODB_DB:             ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION:     ${{ secrets.MONGODB_COLLECTION }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.estado }}" ]; then
            ARGS="$ARGS --estado ${{ github.event.inputs.estado }}"
          fi
          if [ "${{ github.event.inputs.limite }}" != "0" ]; then
            ARGS="$ARGS --limite ${{ github.event.inputs.limite }}"
          fi
          python migrar_fotos.py $ARGS
