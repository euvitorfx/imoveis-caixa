name: Migração de Fotos → R2

on:
  workflow_dispatch:
    inputs:
      estado:
        description: "Estado a processar (ex: SP). Obrigatório para evitar timeout."
        required: true
        default: ""
      limite:
        description: "Máximo de imóveis (0 = todos do estado)"
        default: "0"

jobs:
  migrar:
    runs-on: ubuntu-22.04
    timeout-minutes: 300   # 5h por estado — mais que suficiente para qualquer UF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run migration
        working-directory: scraper
        env:
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
          MONGODB_DB:         ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          R2_ACCOUNT_ID:      ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:   ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:     ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:      ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.estado }}" ]; then
            ARGS="$ARGS --estado ${{ github.event.inputs.estado }}"
          fi
          if [ "${{ github.event.inputs.limite }}" != "0" ]; then
            ARGS="$ARGS --limite ${{ github.event.inputs.limite }}"
          fi
          python migrar_fotos.py $ARGS
